---
kind: Stack
metadata:
  name: binary_stack
spec:
  connection:
    transport:
      redispubsub:
        uri: redis://localhost:6379
        timeout: 60
  models:
    - name: simbus
      model:
        name: simbus
      channels:
        - name: scalar_channel
          expectedModelCount: 3
        - name: binary_channel
          expectedModelCount: 4
    - name: A
      uid: 1
      model:
        name: Messenger
      channels:
        - name: scalar_channel
          alias: scalar
        - name: binary_channel
          alias: binary
    - name: B
      uid: 2
      model:
        name: Messenger
      channels:
        - name: scalar_channel
          alias: scalar
        - name: binary_channel
          alias: binary
    - name: C
      uid: 3
      model:
        name: Messenger
      channels:
        - name: scalar_channel
          alias: scalar
        - name: binary_channel
          alias: binary
    - name: Observer
      uid: 42
      model:
        name: Observer
      channels:
        - name: binary_channel
          alias: binary
---
kind: Model
metadata:
  name: simbus
---
kind: SignalGroup
metadata:
  name: scalar_channel
  labels:
    channel: scalar_channel
spec:
  signals:
    - signal: A_counter
      annotations:
        start: 10
    - signal: B_counter
      annotations:
        start: 300
    - signal: C_counter
      annotations:
        start: 5000
---
kind: SignalGroup
metadata:
  name: binary_channel
  labels:
    channel: binary_channel
  annotations:
    vector_type: binary
spec:
  signals:
    - signal: message
      annotations:
        mime_type: 'application/octet-stream'
