---
name: DSE version bump

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    - cron: '17 6,14,22 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check for DSE version updates
        run: bash .github/scripts/dse_version_bump.sh

      - name: Create or update pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DSE_DEPENDENCY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: Makefile
          branch: bot/dse-version-bump
          delete-branch: true
          commit-message: Bump DSE versions
          title: Bump DSE versions
          body: |
            Updates paired `DSE_*_REPO` and `DSE_*_VERSION` dependencies to newer GitHub tags.

      - name: Enable auto-merge
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.DSE_DEPENDENCY_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
